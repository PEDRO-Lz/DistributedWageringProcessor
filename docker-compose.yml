name: distributed-wagering-processor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-wagering}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-wagering}
      POSTGRES_DB: ${DATABASE_NAME:-wagering}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-wagering} -d ${DATABASE_NAME:-wagering}']
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:4566/_localstack/health | grep -q ''"sqs": "available"''',
        ]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  localstack-data:
